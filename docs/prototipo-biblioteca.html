<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Conecta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A2647;
    --navy-deep:#071A33;
    --blue:#1467D6;
    --blue-bright:#2E86FF;
    --blue-pale:#EAF2FC;
    --blue-pale-2:#F5F9FE;
    --ink:#101826;
    --ink-soft:#4A5568;
    --line:#DCE4EF;
    --white:#FFFFFF;
    --amber:#C7860A;
    --amber-bg:#FCF1DA;
    --green:#177245;
    --green-bg:#E1F3E9;
    --orange:#C15A22;
    --orange-bg:#FBE8DA;
    --red:#B3261E;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--blue-pale-2);color:var(--ink);}
  ::selection{background:var(--blue-bright);color:#fff;}

  /* ---------- HEADER ---------- */
  header{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:68px;
    position:sticky;top:0;z-index:50;
    box-shadow:0 2px 14px rgba(7,26,51,0.25);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{flex-shrink:0;display:flex;}
  .brand-mark.chip{background:#fff;border-radius:11px;padding:5px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .wordmark{font-family:'Montserrat',sans-serif;font-weight:800;line-height:1;text-transform:uppercase;}
  .wordmark.stacked{display:flex;flex-direction:column;gap:2px;}
  .wordmark.stacked .pro{color:#2FA8DE;font-size:28px;letter-spacing:1.5px;}
  .wordmark.stacked .conecta{color:var(--navy);font-size:28px;letter-spacing:1.5px;}
  .wordmark.inline{display:flex;align-items:baseline;gap:6px;}
  .wordmark.inline .pro{color:#5FC1EE;font-size:17px;letter-spacing:.8px;}
  .wordmark.inline .conecta{color:#fff;font-size:17px;letter-spacing:.8px;}

  .header-right{display:flex;align-items:center;gap:14px;}
  .user-chip{display:flex;align-items:center;gap:10px;}
  .user-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .user-meta{display:flex;flex-direction:column;line-height:1.25;}
  .user-meta .u-name{font-size:13.5px;font-weight:700;color:#fff;}
  .user-meta .u-role{font-size:11px;color:#9FB6D6;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .btn-logout{background:rgba(255,255,255,0.1);color:#fff;border:none;border-radius:8px;padding:8px 13px;font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer;}
  .btn-logout:hover{background:rgba(255,255,255,0.2);}

  /* ---------- AUTH (LOGIN / PRIMEIRO ACESSO) ---------- */
  #authView{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
    background:
      linear-gradient(180deg, rgba(7,20,40,.88) 0%, rgba(9,30,56,.94) 55%, var(--navy-deep) 100%),
      url('https://cdn.prod.website-files.com/64a86f9032795ab0798d3f06/69f88f5b06c9e53ef6add0ef_6859ab5e61226ca88dc0fbd2__LIV3882-2-2.webp') center/cover no-repeat;
  }
  .auth-wrap{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:40px 34px 32px;box-shadow:0 30px 70px rgba(3,12,26,.5);}
  .auth-brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px;}
  .auth-brand .brand-mark{margin-bottom:14px;}
  .auth-brand .wordmark.stacked{align-items:center;}
  .auth-form h1{font-size:19px;margin:0 0 4px;color:var(--navy);font-weight:800;text-align:center;}
  .auth-form>p{margin:0 0 22px;color:var(--ink-soft);font-size:13px;text-align:center;}
  .auth-strip{display:flex;gap:6px;margin:22px -34px -32px;border-radius:0 0 18px 18px;overflow:hidden;height:64px;}
  .auth-strip img{flex:1;width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05);}
  .auth-error{background:#FDE8E5;color:#B3453A;font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .demo-box{margin-top:22px;background:var(--blue-pale);border-radius:11px;padding:14px 16px;}
  .demo-box .dtitle{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
  .demo-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12.5px;color:var(--ink);border-top:1px solid #DCE9FA;}
  .demo-row:first-of-type{border-top:none;}
  .demo-row b{color:var(--navy);}
  .demo-row .demo-use{background:#fff;border:1.5px solid var(--line);color:var(--blue);font-family:inherit;font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:7px;cursor:pointer;}
  .demo-row .demo-use:hover{border-color:var(--blue);}
  .auth-link{background:none;border:none;color:var(--blue);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:0;margin-top:16px;text-align:left;}

  /* ---------- USUÁRIOS (ADMIN) ---------- */
  .user-row{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;background:#fff;display:flex;align-items:center;gap:14px;}
  .user-row .u-avatar-lg{width:40px;height:40px;border-radius:50%;background:var(--blue-pale);color:var(--blue);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .user-row .u-info{flex:1;min-width:0;}
  .user-row .u-info .u-line1{font-size:14.5px;font-weight:700;color:var(--navy);}
  .user-row .u-info .u-line2{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .badge-ativo{background:var(--green-bg);color:var(--green);}
  .badge-convite{background:var(--amber-bg);color:var(--amber);}
  .tag-papel{background:var(--blue-pale);color:var(--blue);}

  .modal-overlay{position:fixed;inset:0;background:rgba(7,15,28,.6);display:none;align-items:center;justify-content:center;z-index:210;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-card{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.3);}
  .modal-card h3{margin:0 0 6px;font-size:17px;color:var(--navy);font-weight:800;}
  .modal-card p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);line-height:1.55;}
  .modal-link{background:var(--blue-pale-2);border:1px dashed #B7C6DC;border-radius:9px;padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--blue);word-break:break-all;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap;}

  /* ---------- LAYOUT ---------- */
  .shell{display:flex;min-height:calc(100vh - 68px);}
  nav.side{
    width:222px;flex-shrink:0;background:var(--navy);padding:22px 12px;
  }
  nav.side .tag{color:#6E88AE;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:0 12px 10px;}
  nav.side button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;
    color:#C7D6EA;font-family:inherit;font-size:14.5px;font-weight:600;padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:3px;
  }
  nav.side button .dot{width:6px;height:6px;border-radius:50%;background:#3C5A82;flex-shrink:0;}
  nav.side button:hover{background:rgba(255,255,255,0.06);color:#fff;}
  nav.side button.active{background:var(--blue);color:#fff;}
  nav.side button.active .dot{background:#fff;}
  nav.side .count{margin-left:auto;background:rgba(255,255,255,0.15);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;}
  nav.side button.active .count{background:rgba(255,255,255,0.28);}
  .nav-group-header{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;
    color:#DCE6F5;font-family:inherit;font-size:14.5px;font-weight:700;padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px;margin-top:6px;
  }
  .nav-group-header:hover{background:rgba(255,255,255,0.06);}
  .nav-group-header .chevron{display:inline-block;font-size:10px;color:#7E97BC;transition:transform .15s;flex-shrink:0;}
  .nav-group-header .chevron.open{transform:rotate(90deg);color:#fff;}

  .bell-wrap{position:relative;}
  .btn-bell{position:relative;background:rgba(255,255,255,0.1);color:#fff;border:none;border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .btn-bell:hover{background:rgba(255,255,255,0.2);}
  .bell-badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--navy);}
  .bell-panel{position:absolute;top:46px;right:0;width:290px;background:#fff;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.25);padding:10px;display:none;z-index:60;}
  .bell-panel.show{display:block;}
  .bell-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;padding:6px 8px 10px;}
  .bell-empty{padding:10px 8px;color:var(--ink-soft);font-size:13px;}
  .bell-item{display:block;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:9px 8px;font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;}
  .bell-item:hover{background:var(--blue-pale);}

  main{flex:1;padding:30px 36px 60px;max-width:980px;}
  .page-head{margin-bottom:26px;}
  .page-head h1{font-size:23px;margin:0 0 4px;font-weight:800;color:var(--navy);}
  .page-head p{margin:0;color:var(--ink-soft);font-size:14.5px;}

  /* ---------- CARDS / SECTIONS ---------- */
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin-bottom:22px;}
  .panel h2{font-size:15.5px;margin:0 0 18px;color:var(--navy);font-weight:700;display:flex;align-items:center;gap:8px;}
  .panel h2::before{content:"";width:4px;height:16px;background:var(--blue);border-radius:2px;display:inline-block;}

  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px;}
  input[type=text],input[type=search],textarea,select{
    width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14.5px;color:var(--ink);
    background:var(--blue-pale-2);transition:.15s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue-bright);background:#fff;box-shadow:0 0 0 3px rgba(46,134,255,.14);}
  textarea{resize:vertical;min-height:64px;}
  .field{margin-bottom:16px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;}

  .steps-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .step-item{display:flex;gap:10px;align-items:flex-start;background:var(--blue-pale);border-radius:10px;padding:10px 12px;}
  .step-num{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .step-item{flex-direction:column;align-items:stretch;}
  .step-item .step-main{display:flex;gap:10px;align-items:flex-start;}
  .step-item textarea{background:#fff;min-height:44px;}
  .step-rm{border:none;background:transparent;color:#9AAAC2;cursor:pointer;font-size:18px;line-height:1;padding:4px;margin-top:2px;}
  .step-rm:hover{color:var(--red);}

  .step-photos{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 34px;}
  .photo-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);flex-shrink:0;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .photo-thumb .photo-rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(16,24,38,.75);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .photo-add{width:64px;height:64px;border-radius:8px;border:1.5px dashed #B7C6DC;background:#fff;color:var(--blue);cursor:pointer;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;}
  .photo-add:hover{border-color:var(--blue);background:var(--blue-pale);}
  .photo-add .plus{font-size:18px;line-height:1;}

  .item-steps li{margin-bottom:5px;}
  .item-step-photos{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px;}
  .item-step-photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1.5px solid var(--line);cursor:zoom-in;}

  .lightbox{position:fixed;inset:0;background:rgba(7,15,28,.86);display:none;align-items:center;justify-content:center;z-index:200;padding:30px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:min(820px,90vw);max-height:85vh;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .lightbox-close{position:absolute;top:22px;right:28px;background:rgba(255,255,255,.12);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}

  .btn{
    border:none;border-radius:9px;padding:10px 18px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-bright);}
  .btn-ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue);}
  .btn-ghost:hover{background:var(--blue-pale);}
  .btn-outline-sm{background:#fff;color:var(--ink-soft);border:1.5px solid var(--line);padding:6px 12px;font-size:12.5px;}
  .btn-outline-sm:hover{border-color:var(--blue);color:var(--blue);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-green:hover{filter:brightness(1.08);}
  .btn-orange{background:var(--orange);color:#fff;}
  .btn-orange:hover{filter:brightness(1.08);}

  .type-toggle{display:flex;gap:10px;margin-bottom:18px;}
  .type-toggle button{
    flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer;font-family:inherit;
    text-align:left;transition:.15s;
  }
  .type-toggle button b{display:block;font-size:14px;color:var(--navy);}
  .type-toggle button span{font-size:12px;color:var(--ink-soft);}
  .type-toggle button.active{border-color:var(--blue);background:var(--blue-pale);box-shadow:0 0 0 3px rgba(20,103,214,.1);}

  /* ---------- LIST / SEARCH ---------- */
  .search-bar{position:relative;margin-bottom:20px;}
  .search-bar input{padding-left:38px;}
  .search-bar::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#8CA0BC;font-size:17px;font-weight:700;}

  .item-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:#fff;}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .item-title{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 4px;}
  .item-meta{font-size:12.5px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .item-meta .sep{color:#C6D2E2;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
  .tag-preventiva{background:var(--blue-pale);color:var(--blue);}
  .tag-falha{background:#FDE8E5;color:#B3453A;}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .badge-pendente{background:var(--amber-bg);color:var(--amber);}
  .badge-aprovado{background:var(--green-bg);color:var(--green);}
  .badge-alteracao{background:var(--orange-bg);color:var(--orange);}

  .item-body{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink);line-height:1.55;}
  .item-body .kv{margin-bottom:8px;}
  .item-body .kv b{color:var(--navy);}
  .item-steps{margin:8px 0 0;padding-left:18px;}
  .item-steps li{margin-bottom:5px;}

  .expand-toggle{background:none;border:none;color:var(--blue);font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;padding:0;margin-top:10px;}

  .admin-note{background:var(--orange-bg);border-radius:9px;padding:10px 12px;margin-top:10px;font-size:13px;color:#8A431A;}
  .admin-note b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}

  .review-box{display:flex;gap:10px;margin-top:14px;align-items:flex-start;}
  .review-box textarea{flex:1;min-height:40px;}
  .review-actions{display:flex;flex-direction:column;gap:8px;}

  .empty{text-align:center;padding:44px 20px;color:var(--ink-soft);}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .footer-name{position:absolute;bottom:0;right:0;font-size:11px;color:#9AAAC2;padding:4px 8px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
    padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.2);
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:860px){
    .shell{flex-direction:row;}
    nav.side{width:132px;flex-shrink:0;padding:16px 8px;}
    nav.side .tag{font-size:9.5px;padding:0 6px 8px;}
    nav.side button, nav.side .nav-leaf{font-size:12.5px;padding:9px 8px;white-space:normal;}
    .nav-group-header{font-size:12.5px;padding:9px 8px;}
    main{padding:18px 12px 50px;}
    .row2,.row3{grid-template-columns:1fr;}
    header{padding:0 14px;}
    .user-meta{display:none;}
  }
  @media(max-width:520px){
    nav.side{width:104px;}
    .brand .wordmark.inline{display:none;}
  }
</style>
</head>
<body>

<div id="authView"></div>

<div id="appView" style="display:none">
  <header>
    <div class="brand">
      <div class="brand-mark chip" id="headerMark"></div>
      <div class="wordmark inline"><span class="pro">Pro</span><span class="conecta">Conecta</span></div>
    </div>
    <div class="header-right" id="headerRight"></div>
  </header>

  <div class="shell">
    <nav class="side" id="sideNav"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <img id="lightboxImg" src="" alt="Foto da etapa">
</div>
<div class="modal-overlay" id="inviteModal"></div>
<input type="file" id="hiddenFileInput" accept="image/*" multiple style="display:none">

<script>
/* ============ ESTADO E PERSISTÊNCIA ============ */
let ITEMS = [];
let USERS = [];
let CHAMADOS = [];
let currentUser = null;
let role = 'tecnico';
let view = null;
let currentType = 'preventiva';
let stepsDraft = [];
let searchQ = '';
let filtrosFalhas = { equipamento:'', tipo:'', serie:'' };
let filtrosProc = { equipamento:'', titulo:'' };
let expandedId = null;
let reviewDraftFor = null;

// tela de autenticação: 'login' | 'setup'
let authState = 'login';
let authError = '';
let setupUserId = null;

// admin > usuários
let showUserForm = false;

const PAPEL_LABEL = { tecnico:'Técnico', admin:'Administrador', cliente:'Cliente' };

/* ---------- Armazenamento: usa window.storage quando disponível (dentro do Claude);
   fora daquele ambiente (arquivo aberto direto no navegador), usa localStorage como
   alternativa, para que os dados não se percam a cada vez que a página é aberta. ---------- */
const HAS_CLAUDE_STORAGE = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.get(key, true); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem('proconecta:'+key);
    return raw ? { key, value: raw, shared:true } : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.set(key, value, true); }catch(e){ return null; }
  }
  try{
    localStorage.setItem('proconecta:'+key, value);
    return { key, value, shared:true };
  }catch(e){ return null; }
}

async function loadItems(){
  try{
    const r = await storageGet('items');
    ITEMS = r && r.value ? JSON.parse(r.value) : seedData();
    if(!r || !r.value) await saveItems();
  }catch(e){
    ITEMS = seedData();
    await saveItems();
  }
}
async function saveItems(){
  try{ await storageSet('items', JSON.stringify(ITEMS)); }
  catch(e){ console.error('Falha ao salvar', e); }
}

async function loadUsers(){
  try{
    const r = await storageGet('users');
    USERS = r && r.value ? JSON.parse(r.value) : seedUsers();
    if(!r || !r.value) await saveUsers();
  }catch(e){
    USERS = seedUsers();
    await saveUsers();
  }
}
async function saveUsers(){
  try{ await storageSet('users', JSON.stringify(USERS)); }
  catch(e){ console.error('Falha ao salvar usuários', e); }
}

async function loadChamados(){
  try{
    const r = await storageGet('chamados');
    CHAMADOS = r && r.value ? JSON.parse(r.value) : [];
  }catch(e){
    CHAMADOS = [];
  }
}
async function saveChamados(){

  catch(e){ console.error('Falha ao salvar chamados', e); }
}

function logout(){
  currentUser = null;
  authState = 'login';
  authError = '';
  view = null;
  expandedGroups = new Set();
  renderRoot();
}

function findPathToView(items, targetId, trail){
  for(const it of items){
    if(it.type==='group'){
      const found = findPathToView(it.children, targetId, [...trail, it.label]);
      if(found) return found;
    } else if(it.id===targetId){
      return trail;
    }
  }
  return null;
}
function ensureExpandedForView(){
  const path = findPathToView(NAV[role], view, []);
  if(!path) return;
  let acc = '';
  path.forEach(label=>{ acc = acc ? acc+'>'+label : label; expandedGroups.add(acc); });
}

function renderNavTree(items, depth, pathPrefix){
  const pendCount = ITEMS.filter(i=>i.status==='pendente').length;
  return items.map(it=>{
    const indent = 12 + depth*14;
    if(it.type==='group'){
      const path = pathPrefix ? pathPrefix+'>'+it.label : it.label;
      const open = expandedGroups.has(path);
      return `<button data-group="${escapeAttr(path)}" class="nav-group-header" style="padding-left:${indent}px">
        <span class="chevron ${open?'open':''}">▸</span>${it.label}
      </button>${open ? renderNavTree(it.children, depth+1, path) : ''}`;
    }
    const count = navBadge(it.id, pendCount);
    return `<button data-view="${it.id}" class="nav-leaf ${view===it.id?'active':''}" style="padding-left:${indent}px">
      <span class="dot"></span>${it.label}
      ${count>0 ? `<span class="count">${count}</span>` : ''}
    </button>`;
  }).join('');
}

function renderSideNav(){
  const nav = document.getElementById('sideNav');
  const label = role==='tecnico' ? 'Acesso técnico' : role==='admin' ? 'Acesso administrador' : 'Acesso cliente';
  nav.innerHTML = `<div class="tag">${label}</div>` + renderNavTree(NAV[role], 0, '');
  nav.querySelectorAll('button[data-view]').forEach(b=>{
    b.addEventListener('click', ()=>{ view=b.dataset.view; expandedId=null; render(); });
  });
  nav.querySelectorAll('button[data-group]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const path = b.dataset.group;
      if(expandedGroups.has(path)) expandedGroups.delete(path);
      else expandedGroups.add(path);
      renderSideNav();
    });
  });
}

/* ============ RENDER PRINCIPAL ============ */
function render(){
  if(!view) view = DEFAULT_VIEW[role];
  renderSideNav();
  const main = document.getElementById('main');
  if((role==='tecnico'||role==='admin') && view==='adicionar-falha'){ currentType='falha'; main.innerHTML = viewNovoRegistro(); }
  else if((role==='tecnico'||role==='admin') && view==='adicionar-procedimento'){ currentType='preventiva'; main.innerHTML = viewNovoRegistro(); }
  else if(role==='tecnico' && view==='meus') main.innerHTML = viewLista(ITEMS.filter(i=>i.autorId===currentUser.id), 'meus');
  else if(role==='admin' && view==='fila') main.innerHTML = viewLista(ITEMS.filter(i=>i.status==='pendente'||i.status==='alteracao'), 'fila');
  else if(role==='admin' && view==='usuarios') main.innerHTML = viewUsuarios();
  else if(role==='cliente' && view==='chamado') main.innerHTML = viewChamado();
  else if(view==='biblioteca-falhas') main.innerHTML = viewBibliotecaFalhas();
  else if(view==='biblioteca-procedimentos') main.innerHTML = viewBibliotecaProcedimentos();
  attachHandlers();
}

/* ============ LISTAS (meus / fila) ============ */
function viewLista(list, mode){
  const titles = {
    meus: ['Meus registros', 'Tudo que você já enviou, aprovado ou não.'],
    fila: ['Fila de aprovação', 'Analise, aprove ou sugira alterações nos registros enviados pelos técnicos.'],
  };
  const [h1, sub] = titles[mode];

  let filtered = list;
  if(searchQ.trim()){
    const q = searchQ.toLowerCase();
    filtered = list.filter(i =>
      (i.titulo||'').toLowerCase().includes(q) ||
      (i.equipamento||'').toLowerCase().includes(q) ||
      (i.defeito||'').toLowerCase().includes(q) ||
      (i.causa||'').toLowerCase().includes(q)
    );
  }

  const showSearch = mode!=='fila';

  return `
  <div class="page-head"><h1>${h1}</h1><p>${sub}</p></div>
  ${showSearch ? `
  <div class="search-bar">
    <input type="search" id="searchInput" placeholder="Buscar por equipamento, defeito ou procedimento..." value="${escapeAttr(searchQ)}">
  </div>` : ''}
  ${filtered.length===0 ? emptyState(mode) : filtered.map(i=>itemCard(i, mode)).join('')}
  `;
}

      <button class="btn btn-primary" id="btnAtivar" style="width:100%;justify-content:center;">Ativar acesso</button>
      <button class="auth-link" id="backToLogin">Voltar para o login</button>
    </div>
  </div>`;
}

function attachAuthHandlers(){
  const btnLogin = document.getElementById('btnLogin');
  if(btnLogin) btnLogin.addEventListener('click', doLogin);
  const loginSenha = document.getElementById('login-senha');
  if(loginSenha) loginSenha.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

  document.querySelectorAll('[data-demo]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const u = USERS.find(x=>x.id===b.dataset.demo);
      currentUser = u; authError=''; view=null;
      renderRoot();
    });
  });

  const btnAtivar = document.getElementById('btnAtivar');
  if(btnAtivar) btnAtivar.addEventListener('click', doAtivarConta);

  const back = document.getElementById('backToLogin');
  if(back) back.addEventListener('click', ()=>{ authState='login'; authError=''; renderRoot(); });
}

function doLogin(){
  const email = (document.getElementById('login-email').value||'').trim().toLowerCase();
  const senha = document.getElementById('login-senha').value||'';
  const u = USERS.find(x=>x.email.toLowerCase()===email);
  if(!u){ authError='E-mail não encontrado.'; renderRoot(); return; }
  if(u.status==='convite'){ authError='Este acesso ainda não foi ativado. Use o link de primeiro acesso enviado por e-mail.'; renderRoot(); return; }
  if(u.senha!==senha){ authError='Senha incorreta.'; renderRoot(); return; }
  currentUser = u; authError=''; view=null;
  renderRoot();
}

async function doAtivarConta(){
  const s1 = document.getElementById('setup-senha1').value||'';
  const s2 = document.getElementById('setup-senha2').value||'';
  if(s1.length<6){ authError='A senha precisa ter ao menos 6 caracteres.'; renderRoot(); return; }
  if(s1!==s2){ authError='As senhas não conferem.'; renderRoot(); return; }
  const u = USERS.find(x=>x.id===setupUserId);
  u.status='ativo'; u.senha=s1; u.tokenSetup='';
  await saveUsers();
  authState='login'; authError=''; setupUserId=null;
  showToast('Acesso ativado. Faça login para continuar.');
  renderRoot();
}

async function submitUsuario(){
  const nome = document.getElementById('u-nome').value.trim();
  const cargo = document.getElementById('u-cargo').value.trim();
  const setor = document.getElementById('u-setor').value.trim();
  const papel = document.getElementById('u-papel').value;
  const email = document.getElementById('u-email').value.trim().toLowerCase();

  if(!nome || !email){ showToast('Preencha ao menos nome e e-mail.'); return; }
  if(USERS.some(u=>u.email.toLowerCase()===email)){ showToast('Já existe um usuário com esse e-mail.'); return; }

  const novo = { id:uid(), nome, cargo, setor, email, papel, status:'convite', senha:'', tokenSetup:uid() };
  USERS.push(novo);
  await saveUsers();
  showUserForm = false;
  render();

}

function openInviteModal(u){
  const link = `https://proconecta.app/primeiro-acesso?token=${u.tokenSetup}`;
  const modal = document.getElementById('inviteModal');
  modal.innerHTML = `
    <div class="modal-card">
      <h3>Convite enviado (simulado)</h3>
      <p>Em produção, um e-mail real seria enviado para <b>${escapeHtml(u.email)}</b> com o link de primeiro acesso. Como este é um protótipo sem servidor de e-mail, use os botões abaixo para simular.</p>
      <div class="modal-link">${link}</div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnAbrirConvite">Abrir link agora</button>
        <button class="btn btn-outline-sm" id="btnCopiarConvite">Copiar link</button>
        <button class="btn btn-outline-sm" id="btnFecharConvite">Fechar</button>
      </div>
    </div>`;
  modal.classList.add('show');
  document.getElementById('btnAbrirConvite').addEventListener('click', ()=>{
    modal.classList.remove('show');
    logout();
    setupUserId = u.id;
    authState = 'setup';
    renderRoot();
  });
  document.getElementById('btnCopiarConvite').addEventListener('click', ()=>{

    showToast('Link copiado.');
  });
  document.getElementById('btnFecharConvite').addEventListener('click', ()=>{ modal.classList.remove('show'); });
}

/* ============ HANDLERS ============ */
function attachHandlers(){
  const toggleUserForm = document.getElementById('toggleUserForm');
  if(toggleUserForm) toggleUserForm.addEventListener('click', ()=>{ showUserForm = !showUserForm; render(); });
  const submitU = document.getElementById('submitUsuario');
  if(submitU) submitU.addEventListener('click', submitUsuario);

  // passos dinâmicos
  const stepsList = document.getElementById('stepsList');
  if(stepsList){
    stepsList.querySelectorAll('textarea[data-step]').forEach(ta=>{
      ta.addEventListener('input', ()=>{ stepsDraft[+ta.dataset.step].texto = ta.value; });
    });
    stepsList.querySelectorAll('[data-rmstep]').forEach(b=>{
      b.addEventListener('click', ()=>{ stepsDraft.splice(+b.dataset.rmstep,1); render(); });
    });
    stepsList.querySelectorAll('[data-addphoto]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const fileInput = document.getElementById('hiddenFileInput');
        fileInput.dataset.forstep = b.dataset.addphoto;
        fileInput.value = '';
        fileInput.click();
      });
    });
    stepsList.querySelectorAll('[data-rmphoto]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [si,pi] = b.dataset.rmphoto.split(':').map(Number);
        stepsDraft[si].imagens.splice(pi,1);
        render();
      });
    });
  }
  const addStep = document.getElementById('addStep');
  if(addStep) addStep.addEventListener('click', ()=>{ stepsDraft.push(novoPasso()); render(); });

  // lightbox (miniaturas de etapas, tanto no form quanto nos cards da biblioteca)
  document.querySelectorAll('[data-lightbox]').forEach(img=>{
    img.addEventListener('click', ()=>openLightbox(img.dataset.lightbox));
  });

  // submits
  const subP = document.getElementById('submitPreventiva');
  if(subP) subP.addEventListener('click', submitPreventiva);
  const subF = document.getElementById('submitFalha');
  if(subF) subF.addEventListener('click', submitFalha);
  const subCh = document.getElementById('submitChamado');
  if(subCh) subCh.addEventListener('click', submitChamado);

  // busca (meus/fila)
  const search = document.getElementById('searchInput');
  if(search){
    search.addEventListener('input', ()=>{ searchQ = search.value; renderKeepingFocus('searchInput'); });
  }

  // filtros: Defeitos/Falhas
  bindFilterInput('ff-equipamento', v=>filtrosFalhas.equipamento=v);
  bindFilterInput('ff-tipo', v=>filtrosFalhas.tipo=v);
  bindFilterInput('ff-serie', v=>filtrosFalhas.serie=v);

  // filtros: Manual de Procedimentos
  bindFilterInput('fp-equipamento', v=>filtrosProc.equipamento=v);
  bindFilterInput('fp-titulo', v=>filtrosProc.titulo=v);

  // expandir
  document.querySelectorAll('[data-toggle]').forEach(b=>{
    b.addEventListener('click', ()=>{ expandedId = expandedId===b.dataset.toggle ? null : b.dataset.toggle; render(); preserveScroll(); });
  });

  // aprovação / sugestão
  document.querySelectorAll('[data-approve]').forEach(b=>{
    b.addEventListener('click', ()=>decide(b.dataset.approve,'aprovado'));
  });
  document.querySelectorAll('[data-suggest]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.suggest;
      const note = document.querySelector(`[data-reviewnote="${id}"]`).value.trim();
      if(!note){ showToast('Escreva o que precisa ser alterado antes de enviar.'); return; }
      decide(id,'alteracao',note);
    });
  });
}

document.getElementById('hiddenFileInput').addEventListener('change', async (e)=>{
  const stepIdx = +e.target.dataset.forstep;
  const files = Array.from(e.target.files || []);
  if(files.length===0) return;
  for(const file of files){
    try{
      const dataUrl = await resizeImage(file, 700, 0.72);
      stepsDraft[stepIdx].imagens.push(dataUrl);
    }catch(err){ console.error('Falha ao processar imagem', err); }
  }
  render();
});

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightboxImg').src = '';
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') closeLightbox(); });

let scrollY = 0;
function preserveScroll(){ window.scrollTo(0, scrollY); }
window.addEventListener('scroll', ()=>{ scrollY = window.scrollY; });

function bindFilterInput(id, setter){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{ setter(el.value); renderKeepingFocus(id); });
}

function renderKeepingFocus(inputId){
  const el = document.getElementById(inputId);
  const pos = el ? el.selectionStart : null;
  render();
  const s = document.getElementById(inputId);
  if(s){ s.focus(); if(pos!==null) s.setSelectionRange(pos,pos); }
}

async function submitPreventiva(){
  const titulo = document.getElementById('f-titulo').value.trim();
  const equipamento = document.getElementById('f-equipamento').value.trim();
  const periodicidade = document.getElementById('f-periodicidade').value;
  const precaucoes = document.getElementById('f-precaucoes').value.trim();
  const ferramentas = document.getElementById('f-ferramentas').value.trim();
  const passos = stepsDraft
    .map(s=>({texto:s.texto.trim(), imagens:s.imagens}))
    .filter(s=>s.texto);

  if(!titulo || !equipamento || passos.length===0){
    showToast('Preencha título, equipamento e ao menos uma etapa.'); return;
  }

  ITEMS.unshift({
    id:uid(), tipo:'preventiva', status:'pendente',
    titulo, equipamento, periodicidade, precaucoes, ferramentas, passos,
    autor:currentUser.nome, autorId:currentUser.id, criadoEm:today(), adminComentario:'', decididoEm:'', decididoPor:''
  });
  await saveItems();
  stepsDraft = [novoPasso(), novoPasso()];
  showToast('Registro enviado para análise do administrador.');
  view = role==='admin' ? 'fila' : 'meus'; render();
}

async function submitFalha(){
  const titulo = document.getElementById('f-titulo').value.trim();
  const equipamento = document.getElementById('f-equipamento').value.trim();
  const numeroSerie = document.getElementById('f-serie').value.trim();
  const defeito = document.getElementById('f-defeito').value.trim();
  const causa = document.getElementById('f-causa').value.trim();
  const solucao = document.getElementById('f-solucao').value.trim();

  if(!titulo || !equipamento || !defeito || !solucao){
    showToast('Preencha ao menos título, equipamento, defeito e solução.'); return;
  }

  ITEMS.unshift({
    id:uid(), tipo:'falha', status:'pendente',
    titulo, equipamento, numeroSerie, defeito, causa, solucao,
    autor:currentUser.nome, autorId:currentUser.id, criadoEm:today(), adminComentario:'', decididoEm:'', decididoPor:''
  });
  await saveItems();
  showToast('Registro enviado para análise do administrador.');
  view = role==='admin' ? 'fila' : 'meus'; render();
}

async function decide(id, status, note){
  const item = ITEMS.find(i=>i.id===id);
  if(!item) return;
  item.status = status;
  item.adminComentario = status==='alteracao' ? note : '';
  item.decididoEm = today();
  item.decididoPor = currentUser.nome;
  await saveItems();
  showToast(status==='aprovado' ? 'Registro aprovado e publicado na biblioteca.' : 'Alteração solicitada ao técnico.');
  render();
}

/* ============ UTIL ============ */
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

async function boot(){
  await loadUsers();
  await loadItems();
  await loadChamados();
  renderRoot();
}
boot();
