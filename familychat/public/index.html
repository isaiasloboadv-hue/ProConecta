<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyChat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tela-auth" class="tela-auth">
  <div class="cartao-auth">
    <h1>💬 FamilyChat</h1>
    <p class="subtitulo">Um WhatsApp caseiro, só pra família</p>

    <div class="abas-auth">
      <button id="aba-login" class="aba ativa">Entrar</button>
      <button id="aba-registrar" class="aba">Criar conta</button>
    </div>

    <form id="form-login" class="form-auth">
      <label>Telefone</label>
      <input type="tel" id="login-telefone" placeholder="(12) 99999-0000" required>
      <label>Senha</label>
      <input type="password" id="login-senha" required>
      <div class="erro" id="login-erro"></div>
      <button type="submit">Entrar</button>
    </form>

    <form id="form-registrar" class="form-auth escondido">
      <label>Seu nome</label>
      <input type="text" id="reg-nome" placeholder="Como a família te conhece" required>
      <label>Telefone</label>
      <input type="tel" id="reg-telefone" placeholder="(12) 99999-0000" required>
      <label>Senha</label>
      <input type="password" id="reg-senha" placeholder="mín. 4 caracteres" required>
      <div class="erro" id="reg-erro"></div>
      <button type="submit">Criar conta</button>
    </form>
  </div>
</div>

<div id="tela-app" class="tela-app escondido">
  <aside class="barra-lateral">
    <div class="cabecalho-lateral">
      <div class="meu-perfil">
        <span class="avatar" id="meu-avatar"></span>
        <span id="meu-nome"></span>
      </div>
      <button id="btn-sair" title="Sair">⏻</button>
    </div>
    <div class="acoes-lateral">
      <button id="btn-nova-conversa">＋ Conversa</button>
      <button id="btn-novo-grupo">👪 Grupo</button>
    </div>
    <div id="lista-conversas" class="lista-conversas"></div>
  </aside>

  <main class="area-chat">
    <div id="chat-vazio" class="chat-vazio">
      <p>Selecione uma conversa ou comece uma nova 👋</p>
    </div>
    <div id="chat-ativo" class="chat-ativo escondido">
      <div class="cabecalho-chat">
        <span class="avatar" id="chat-avatar"></span>
        <div>
          <div id="chat-nome" class="chat-nome"></div>
          <div id="chat-membros" class="chat-membros"></div>
        </div>
      </div>
      <div id="mensagens" class="mensagens"></div>
      <form id="form-mensagem" class="form-mensagem">
        <input type="text" id="input-mensagem" placeholder="Digite uma mensagem" autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </div>
  </main>
</div>

<div id="modal-fundo" class="modal-fundo escondido">
  <div class="modal">
    <div class="modal-cabecalho">
      <h2 id="modal-titulo">Nova conversa</h2>
      <button id="modal-fechar">✕</button>
    </div>
    <div id="modal-nome-grupo-wrap" class="escondido">
      <label>Nome do grupo</label>
      <input type="text" id="modal-nome-grupo" placeholder="Ex.: Família Silva">
    </div>
    <div id="modal-lista-usuarios" class="modal-lista-usuarios"></div>
    <div class="erro" id="modal-erro"></div>
    <button id="modal-confirmar" class="escondido">Criar grupo</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
