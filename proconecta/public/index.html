<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexor Connect</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B2D4F">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexor Connect">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="splashView">
  <div class="auth-brand" style="margin-bottom:0;">
    <div class="brand-mark"><img class="brand-mark-img" src="/logo.png" alt="Nexor Connect" style="height:64px;width:auto;display:block;"></div>
    <div class="wordmark stacked"><span class="pro">Nexor</span><span class="conecta">Connect</span></div>
    <div class="brand-tagline">Conectando pessoas, máquinas e conhecimento</div>
  </div>
</div>

<div id="authView" style="display:none">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-mark"><img class="brand-mark-img" src="/logo.png" alt="Nexor Connect" style="height:64px;width:auto;display:block;"></div>
      <div class="wordmark stacked"><span class="pro">Nexor</span><span class="conecta">Connect</span></div>
      <div class="brand-tagline">Conectando pessoas, máquinas e conhecimento</div>
    </div>
    <div class="auth-form">
      <h1>Entrar</h1>
      <p>Acesse com o e-mail e a senha cadastrados.</p>
      <div class="auth-error hidden" id="login-erro"></div>
      <div class="field"><label>E-mail</label><input id="login-email" placeholder="seu@email.com.br"></div>
      <div class="field"><label>Senha</label><input id="login-senha" type="password"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="fazerLogin()">Entrar</button>
    </div>
    <div class="auth-strip">
      <img src="https://cdn.prod.website-files.com/64a86f9032795ab0798d3f06/685ab32423bc994dd27144a4_Rob%C3%B4%20Colaborativo.jpg" alt="">
      <img src="https://cdn.prod.website-files.com/64a86f9032795ab0798d3f06/69f88f5b06c9e53ef6add0ef_6859ab5e61226ca88dc0fbd2__LIV3882-2-2.webp" alt="">
      <img src="https://cdn.prod.website-files.com/64a86f9032795ab0798d3f06/69f8907126254ddae3d4eb58_661e92f0dd08c23d939a7a92_m%C3%A1quina-de-grava%C3%A7%C3%A3o-a-laser-smartbox-portatil-10.webp" alt="">
    </div>
  </div>
</div>

<div id="appView" style="display:none">
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="hamburger-btn" id="btn-hamburger" onclick="alternarMenuMobile()" aria-label="Abrir menu">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <div class="brand-mark chip"><img class="brand-mark-img" src="/logo.png" alt="Nexor Connect" style="height:28px;width:auto;display:block;"></div>
        <div class="wordmark inline"><span class="pro">Nexor</span><span class="conecta">Connect</span></div>
        <span class="empresa-tag" id="empresaTag"></span>
      </div>
    </div>
    <div class="header-right" id="headerRight"></div>
  </header>

  <div class="nav-backdrop" id="navBackdrop" onclick="fecharMenuMobile()"></div>
  <div class="shell">
    <nav class="side" id="sideNav"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="fecharLightbox()">×</button>
  <img id="lightbox-img" src="" alt="Foto ampliada">
</div>
<div class="modal-overlay" id="inviteModal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.iife.js"></script>
<!-- RCM/SAP PM Fase 1, passo 7 — gráficos mensais do dashboard de KPIs (ver renderKpisDashboard).
     Via jsdelivr (mesmo CDN já usado acima pro docx.js) em vez de cdnjs: o caminho exato do
     arquivo (dist/chart.umd.js) foi conferido direto no pacote publicado no npm — o pacote da
     Chart.js não publica uma variante .min.js própria, então usamos a não-minificada mesmo, pra
     garantir que o arquivo existe de verdade nesse caminho. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<!-- RCM/SAP PM Fase 1, passo 8 — exportação Excel do dashboard de KPIs (ver exportarKpisExcel).
     Caminho (dist/xlsx.full.min.js) é o mesmo que o próprio pacote "xlsx" no npm indica como seu
     build pra CDN (campo "jsdelivr" do package.json). -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
