<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexor Connect — Aprovar Orçamento</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body{background:var(--bg, #F4F6FA);}
  .osa-wrap{max-width:640px;margin:0 auto;padding:28px 16px 60px;}
  .osa-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .osa-brand img{height:34px;width:auto;display:block;}
  .osa-brand .wordmark{font-family:Montserrat,sans-serif;font-weight:800;font-size:19px;color:var(--navy);}
  .osa-brand .wordmark .conecta{color:var(--blue);}
  .osa-kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .osa-kv:last-child{border-bottom:none;}
  .osa-kv b{color:var(--ink-soft);font-weight:600;}
  .osa-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;border-top:1.5px solid var(--navy);font-size:15px;font-weight:800;}
  .osa-total span:last-child{color:var(--blue);}
  .osa-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
  .osa-badge.rascunho{background:#FFF3DC;color:#A6700B;}
  .osa-badge.aprovado{background:#E2F6EA;color:#1E8A4C;}
  .osa-badge.cancelado{background:#FBE4E4;color:#C13A3A;}
  #osa-canvas{width:100%;max-width:560px;height:200px;border:1.5px dashed var(--line);border-radius:9px;background:#fff;touch-action:none;display:block;}
  .osa-status{margin-top:8px;font-size:12.5px;color:var(--ink-soft);}
  .osa-center{text-align:center;padding:40px 10px;color:var(--ink-soft);font-size:13.5px;}
</style>
</head>
<body>
<div class="osa-wrap">
  <div class="osa-brand">
    <img src="/logo.png" alt="Nexor Connect">
    <div class="wordmark">Nexor<span class="conecta">Connect</span></div>
  </div>
  <div id="conteudo"><div class="osa-center">Carregando...</div></div>
</div>

<script>
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtMoeda(v) { return `R$ ${Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function fmtData(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('pt-BR');
}
function fmtValidade(orcamento) {
  if (!orcamento.criado_em || !orcamento.validade_dias) return '—';
  const d = new Date(orcamento.criado_em);
  if (isNaN(d.getTime())) return '—';
  d.setDate(d.getDate() + Number(orcamento.validade_dias));
  return d.toLocaleDateString('pt-BR');
}
function paramToken() { return new URLSearchParams(window.location.search).get('token') || ''; }
const TOKEN = paramToken();

let orcamento = null;
let assinaturaImg = null;
let temTraco = false;

async function carregar() {
  const conteudo = document.getElementById('conteudo');
  if (!TOKEN) { conteudo.innerHTML = '<div class="auth-error">Link inválido: token não informado.</div>'; return; }
  try {
    const res = await fetch('/api/os-refrigeracao-orcamentos-assinar/' + TOKEN);
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Link inválido ou expirado.');
    orcamento = data.orcamento;
    assinaturaImg = orcamento.assinatura_cliente_img || null;
    if (orcamento.status === 'cancelado') renderCancelado();
    else if (assinaturaImg) renderAprovado();
    else renderFormulario();
  } catch (e) {
    conteudo.innerHTML = `<div class="auth-error">${esc(e.message)}</div>`;
  }
}

// pedido explícito do usuário: diferente do app de referência (iClima — cujo PDF/link mostra só
// o total, escondendo o que está sendo cobrado), este resumo SEMPRE detalha serviços, materiais,
// mão de obra, desconto e condições de pagamento — nunca só o total.
function blocoResumo() {
  const badge = `<span class="osa-badge ${esc(orcamento.status)}">${orcamento.status === 'aprovado' ? 'Aprovado' : orcamento.status === 'cancelado' ? 'Cancelado' : 'Rascunho'}</span>`;
  return `
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <h2 style="margin:0;">${esc(orcamento.titulo || 'Orçamento')}</h2>
        ${badge}
      </div>
      <div class="osa-kv"><b>Cliente</b><span>${esc(orcamento.cliente_nome || '—')}</span></div>
      <div class="osa-kv"><b>Data</b><span>${fmtData(orcamento.criado_em)}</span></div>
      <div class="osa-kv"><b>Válido até</b><span>${fmtValidade(orcamento)}</span></div>
      ${orcamento.descricao_cliente ? `<div class="osa-kv" style="display:block;"><b>O que você relatou</b><div style="margin-top:4px;">${esc(orcamento.descricao_cliente)}</div></div>` : ''}
      ${orcamento.diagnostico_tecnico ? `<div class="osa-kv" style="display:block;"><b>Diagnóstico técnico</b><div style="margin-top:4px;">${esc(orcamento.diagnostico_tecnico)}</div></div>` : ''}
      ${orcamento.descricao_geral ? `<div class="osa-kv" style="display:block;"><b>Descrição geral</b><div style="margin-top:4px;">${esc(orcamento.descricao_geral)}</div></div>` : ''}
    </div>
    <div class="panel">
      <h2>Valores</h2>
      ${(orcamento.materiais || []).map((m) => `<div class="osa-kv"><span>${esc(m.nome)} (${m.quantidade}x)</span><span>${fmtMoeda(m.quantidade * m.valor_unitario)}</span></div>`).join('')}
      ${(orcamento.servicos || []).map((s) => `<div class="osa-kv"><span>${esc(s.descricao)}</span><span>${fmtMoeda(s.valor)}</span></div>`).join('')}
      ${orcamento.mao_de_obra ? `<div class="osa-kv"><span>Mão de obra</span><span>${fmtMoeda(orcamento.mao_de_obra)}</span></div>` : ''}
      ${orcamento.desconto_aplicado ? `<div class="osa-kv"><span>Desconto${orcamento.desconto_tipo === 'percentual' ? ` (${orcamento.desconto_valor}%)` : ''}</span><span>- ${fmtMoeda(orcamento.desconto_aplicado)}</span></div>` : ''}
      <div class="osa-total"><span>Total</span><span>${fmtMoeda(orcamento.total)}</span></div>
    </div>
    ${orcamento.condicoes_pagamento ? `<div class="panel"><h2>Condições de pagamento</h2><p style="font-size:13.5px; color:var(--ink); line-height:1.6; margin:0;">${esc(orcamento.condicoes_pagamento)}</p></div>` : ''}`;
}

function renderCancelado() {
  document.getElementById('conteudo').innerHTML = blocoResumo() + `
    <div class="panel">
      <h2>Orçamento cancelado</h2>
      <p style="font-size:13.5px; color:var(--ink-soft); line-height:1.6;">Este orçamento foi cancelado pela empresa e não pode mais ser aprovado por este link.</p>
    </div>`;
}

function renderAprovado() {
  document.getElementById('conteudo').innerHTML = blocoResumo() + `
    <div class="panel">
      <h2>Orçamento aprovado</h2>
      <p style="font-size:13.5px; color:var(--ink-soft); line-height:1.6;">Você já aprovou este orçamento — obrigado por confirmar.</p>
      <div style="margin-top:14px;"><b style="font-size:12.5px; color:var(--ink-soft);">Sua assinatura:</b><br><img src="${esc(assinaturaImg)}" style="max-width:280px; border:1px solid var(--line); border-radius:8px; margin-top:6px;"></div>
    </div>`;
}

function renderFormulario() {
  document.getElementById('conteudo').innerHTML = blocoResumo() + `
    <div class="panel">
      <h2>Aprovar orçamento</h2>
      <p style="font-size:13px; color:var(--ink-soft); line-height:1.6;">Assine abaixo para aprovar o orçamento com os valores detalhados acima.</p>
      <canvas id="osa-canvas" width="600" height="200"></canvas>
      <div class="osa-status" id="osa-assinatura-status">Assinatura pendente</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
        <button class="btn-outline-sm" onclick="limparAssinatura()">Limpar</button>
        <button class="btn btn-primary btn-sm" onclick="confirmar()">Aprovar e assinar</button>
      </div>
    </div>
    <div id="osa-erro" class="auth-error hidden" style="margin-bottom:14px;"></div>`;
  montarCanvas();
}

function montarCanvas() {
  const canvas = document.getElementById('osa-canvas');
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0B2D4F';
  temTraco = false;
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
  }
  let desenhando = false;
  function iniciar(e) { e.preventDefault(); desenhando = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function mover(e) { if (!desenhando) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); temTraco = true; }
  function parar() {
    if (!desenhando) return;
    desenhando = false;
    if (temTraco) { assinaturaImg = canvas.toDataURL('image/png'); atualizarStatusAssinatura(); }
  }
  canvas.addEventListener('mousedown', iniciar);
  canvas.addEventListener('mousemove', mover);
  window.addEventListener('mouseup', parar);
  canvas.addEventListener('touchstart', iniciar, { passive: false });
  canvas.addEventListener('touchmove', mover, { passive: false });
  canvas.addEventListener('touchend', parar);
}
function atualizarStatusAssinatura() {
  const el = document.getElementById('osa-assinatura-status');
  if (el) { el.textContent = temTraco ? 'Assinatura registrada' : 'Assinatura pendente'; el.style.color = temTraco ? 'var(--green)' : 'var(--ink-soft)'; }
}
function limparAssinatura() {
  const canvas = document.getElementById('osa-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  temTraco = false;
  assinaturaImg = null;
  atualizarStatusAssinatura();
}

async function confirmar() {
  const erroEl = document.getElementById('osa-erro');
  erroEl.classList.add('hidden');
  if (!temTraco || !assinaturaImg) { erroEl.textContent = 'Desenhe a assinatura antes de confirmar.'; erroEl.classList.remove('hidden'); return; }
  try {
    const res = await fetch('/api/os-refrigeracao-orcamentos-assinar/' + TOKEN, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ assinatura_cliente_img: assinaturaImg }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Não foi possível confirmar.');
    orcamento = data.orcamento;
    renderAprovado();
  } catch (e) {
    erroEl.textContent = e.message; erroEl.classList.remove('hidden');
  }
}

carregar();
</script>
</body>
</html>
