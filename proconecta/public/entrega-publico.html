<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexor Connect — Entrega para Teste</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body{background:var(--bg, #F4F6FA);}
  .ep-wrap{max-width:640px;margin:0 auto;padding:28px 16px 60px;}
  .ep-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .ep-brand img{height:34px;width:auto;display:block;}
  .ep-brand .wordmark{font-family:Montserrat,sans-serif;font-weight:800;font-size:19px;color:var(--navy);}
  .ep-brand .wordmark .conecta{color:var(--blue);}
  #ep-canvas{width:100%;max-width:560px;height:200px;border:1.5px dashed var(--line);border-radius:9px;background:#fff;touch-action:none;display:block;}
  .ep-status{margin-top:8px;font-size:12.5px;color:var(--ink-soft);}
  .ep-center{text-align:center;padding:40px 10px;color:var(--ink-soft);font-size:13.5px;}
</style>
</head>
<body>
<div class="ep-wrap">
  <div class="ep-brand">
    <img src="/logo.png" alt="Nexor Connect">
    <div class="wordmark">Nexor<span class="conecta">Connect</span></div>
  </div>
  <div id="conteudo"><div class="ep-center">Carregando...</div></div>
</div>

<script>
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtData(iso) {
  if (!iso) return '—';
  const [ano, mes, dia] = String(iso).slice(0, 10).split('-');
  return dia && mes && ano ? `${dia}/${mes}/${ano}` : '—';
}
function paramToken() { return new URLSearchParams(window.location.search).get('token') || ''; }
const TOKEN = paramToken();

let registro = null;
let assinaturaImg = null;
let temTraco = false;

async function carregar() {
  const conteudo = document.getElementById('conteudo');
  if (!TOKEN) { conteudo.innerHTML = '<div class="auth-error">Link inválido: token não informado.</div>'; return; }
  try {
    const res = await fetch('/api/entregas/' + TOKEN);
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Link inválido ou expirado.');
    registro = data.relatorio;
    assinaturaImg = registro.assinatura_cliente_img || null;
    if (registro.status_preenchimento === 'concluido') renderConcluido();
    else renderFormulario();
  } catch (e) {
    conteudo.innerHTML = `<div class="auth-error">${esc(e.message)}</div>`;
  }
}

function renderConcluido() {
  const r = registro;
  document.getElementById('conteudo').innerHTML = `
    <div class="panel">
      <h2>Comprovante concluído</h2>
      <p style="font-size:13.5px; color:var(--ink-soft); line-height:1.6;">Este comprovante de entrega para teste já foi preenchido e assinado — não é mais possível editá-lo por aqui. Qualquer dúvida, entre em contato com ${esc(r.tecnico_nome || 'o técnico responsável')}.</p>
      <div class="kv"><b>Empresa:</b> ${esc(r.empresa)} · <b>Contato:</b> ${esc(r.contato)}</div>
      <div class="kv"><b>Equipamento:</b> ${esc(r.equipamento)}${r.numero_serie ? ' — ' + esc(r.numero_serie) : ''}</div>
      <div class="kv"><b>Entrega:</b> ${fmtData(r.data_entrega)} · <b>Devolução prevista:</b> ${fmtData(r.data_prevista_devolucao)}</div>
      ${r.assinatura_cliente_img ? `<div style="margin-top:14px;"><b style="font-size:12.5px; color:var(--ink-soft);">Assinado por ${esc(r.assinatura_cliente_nome)}:</b><br><img src="${r.assinatura_cliente_img}" style="max-width:280px; border:1px solid var(--line); border-radius:8px; margin-top:6px;"></div>` : ''}
    </div>`;
}

function renderFormulario() {
  const d = registro;
  document.getElementById('conteudo').innerHTML = `
    <div class="panel">
      <h2>Dados do cliente</h2>
      <p style="font-size:13px; color:var(--ink-soft); margin-top:-10px;">Preencha (ou confira) os dados abaixo e assine no fim da página. Pode salvar o progresso e voltar depois, se precisar.</p>
      <div class="field"><label>Empresa*</label><input id="ep-empresa" value="${esc(d.empresa)}"></div>
      <div class="field"><label>Contato*</label><input id="ep-contato" placeholder="Nome de quem está recebendo" value="${esc(d.contato)}"></div>
      <div class="field"><label>E-mail*</label><input id="ep-email" type="email" value="${esc(d.email)}"></div>
    </div>
    <div class="panel">
      <h2>Equipamento e prazo do teste</h2>
      <div class="field"><label>Equipamento*</label><input id="ep-equipamento" value="${esc(d.equipamento)}"></div>
      <div class="field"><label>Nº de série</label><input id="ep-numero_serie" value="${esc(d.numero_serie)}"></div>
      <div class="field"><label>Data de entrega*</label><input id="ep-data_entrega" type="date" value="${esc(d.data_entrega)}"></div>
      <div class="field"><label>Data prevista de devolução*</label><input id="ep-data_prevista_devolucao" type="date" value="${esc(d.data_prevista_devolucao)}"></div>
    </div>
    <div class="panel">
      <h2>Observações</h2>
      <textarea id="ep-observacoes" placeholder="Opcional">${esc(d.observacoes)}</textarea>
    </div>
    <div class="panel">
      <h2>Assinatura*</h2>
      <p style="font-size:13px; color:var(--ink-soft); line-height:1.6;">Assinando abaixo, você confirma o recebimento do equipamento nas condições combinadas com ${esc(d.tecnico_nome || 'o técnico')}.</p>
      <div class="field"><label>Nome de quem assina</label><input id="ep-assinatura-nome" value="${esc(d.assinatura_cliente_nome)}"></div>
      <canvas id="ep-canvas" width="600" height="200"></canvas>
      <div class="ep-status" id="ep-assinatura-status">${assinaturaImg ? 'Assinatura registrada' : 'Assinatura pendente'}</div>
      <button class="btn-outline-sm" style="margin-top:8px;" onclick="limparAssinatura()">Limpar assinatura</button>
    </div>
    <div id="ep-erro" class="auth-error hidden" style="margin-bottom:14px;"></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-outline-sm" onclick="salvarProgresso()">Salvar progresso</button>
      <button class="btn btn-primary btn-sm" onclick="concluir()">Concluir e assinar</button>
    </div>
    <div class="ep-status" id="ep-salvo-status"></div>`;
  montarCanvas();
}

function montarCanvas() {
  const canvas = document.getElementById('ep-canvas');
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0B2D4F';
  temTraco = false;
  if (assinaturaImg) {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); temTraco = true; atualizarStatusAssinatura(); };
    img.src = assinaturaImg;
  }
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
  }
  let desenhando = false;
  function iniciar(e) { e.preventDefault(); desenhando = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function mover(e) { if (!desenhando) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); temTraco = true; }
  function parar() {
    if (!desenhando) return;
    desenhando = false;
    if (temTraco) { assinaturaImg = canvas.toDataURL('image/png'); atualizarStatusAssinatura(); }
  }
  canvas.addEventListener('mousedown', iniciar);
  canvas.addEventListener('mousemove', mover);
  window.addEventListener('mouseup', parar);
  canvas.addEventListener('touchstart', iniciar, { passive: false });
  canvas.addEventListener('touchmove', mover, { passive: false });
  canvas.addEventListener('touchend', parar);
}
function atualizarStatusAssinatura() {
  const el = document.getElementById('ep-assinatura-status');
  if (el) { el.textContent = temTraco ? 'Assinatura registrada' : 'Assinatura pendente'; el.style.color = temTraco ? 'var(--green)' : 'var(--ink-soft)'; }
}
function limparAssinatura() {
  const canvas = document.getElementById('ep-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  temTraco = false;
  assinaturaImg = null;
  atualizarStatusAssinatura();
}

function lerCampos() {
  return {
    empresa: document.getElementById('ep-empresa').value,
    contato: document.getElementById('ep-contato').value,
    email: document.getElementById('ep-email').value,
    equipamento: document.getElementById('ep-equipamento').value,
    numero_serie: document.getElementById('ep-numero_serie').value,
    data_entrega: document.getElementById('ep-data_entrega').value,
    data_prevista_devolucao: document.getElementById('ep-data_prevista_devolucao').value,
    observacoes: document.getElementById('ep-observacoes').value,
    assinatura_cliente_nome: document.getElementById('ep-assinatura-nome').value,
    assinatura_cliente_img: assinaturaImg,
  };
}

async function salvarProgresso() {
  const status = document.getElementById('ep-salvo-status');
  try {
    const res = await fetch('/api/entregas/' + TOKEN, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lerCampos()),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Não foi possível salvar.');
    registro = data.relatorio;
    if (status) { status.textContent = 'Progresso salvo — pode fechar e continuar depois pelo mesmo link.'; status.style.color = 'var(--green)'; }
  } catch (e) {
    if (status) { status.textContent = e.message; status.style.color = 'var(--red, #B3453A)'; }
  }
}

async function concluir() {
  const erroEl = document.getElementById('ep-erro');
  erroEl.classList.add('hidden');
  const campos = lerCampos();
  const obrigatorios = ['empresa', 'contato', 'email', 'equipamento', 'data_entrega', 'data_prevista_devolucao'];
  for (const c of obrigatorios) {
    if (!String(campos[c] || '').trim()) { erroEl.textContent = 'Preencha todos os campos obrigatórios.'; erroEl.classList.remove('hidden'); return; }
  }
  if (!campos.assinatura_cliente_nome || !campos.assinatura_cliente_img) {
    erroEl.textContent = 'Informe o nome e desenhe a assinatura antes de concluir.'; erroEl.classList.remove('hidden'); return;
  }
  try {
    const res = await fetch('/api/entregas/' + TOKEN + '/concluir', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(campos),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Não foi possível concluir.');
    registro = data.relatorio;
    renderConcluido();
  } catch (e) {
    erroEl.textContent = e.message; erroEl.classList.remove('hidden');
  }
}

carregar();
</script>
</body>
</html>
